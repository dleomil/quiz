<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script defer src="js/utils.js?v=1"></script>
  <script defer src="js/store.js?v=4"></script>
