name: Promotion Gate

on:
  pull_request:
    branches: [main]
    paths: ['.github/promotion-manifest.json', '**']

permissions:
  contents: read

jobs:
  promotion-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-promotion-manifest.cjs
