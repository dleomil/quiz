name: PR Governance

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate branch policy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          npm run validate:branch -- "$HEAD_REF" "$BASE_REF"
          npm run test:branch-policy

      - name: Validate repository documentation presence
        run: |
          test -f docs/README.md
          test -f docs/github/branching-and-delivery-strategy.md

      - name: Validate lint and formatting
        run: |
          npm run lint
          npm run format:check
