name: PR Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate branch policy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          npm run validate:branch -- "$HEAD_REF" "$BASE_REF"
          npm run validate:branch-sync -- "$HEAD_REF" "$BASE_REF" origin/pr-head
          npm run test:branch-policy

      - name: Validate merge message in Portuguese
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/merge-message-policy.cjs validate-pr

      - name: Validate repository documentation presence
        run: |
          test -f docs/README.md
          test -f docs/github/branching-and-delivery-strategy.md

      - name: Validate agent capabilities
        run: npm run validate:agents

      - name: Validar contexto e runner editorial sem chamadas reais
        run: |
          npm run test:agent-context
          npm run test:editorial-runner
          npm run test:writer-runner

      - name: Validate agent execution record contract
        run: |
          npm run test:agent-records
          npm run test:record-ledger

      - name: Validate versioned governance guidelines
        run: |
          npm run validate:guidelines
          npm run test:guidelines

      - name: Validar catalogo e mudancas documentais
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          npm run validate:documents -- --base-ref "origin/${BASE_REF}"
          npm run test:documents

      - name: Validate read-only governance MCP
        run: |
          npm run validate:mcp-governance
          npm run test:mcp-governance

      - name: Validate lint and formatting
        run: |
          npm run lint
          npm run format:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate safe frontend rendering
        run: npm run test:frontend-security

      - name: Validate pedagogical regression corpus
        run: npm run test:pedagogical-regression

      - name: Validar conteudo, idiomas e apoio bilingue
        run: |
          npm run validate:content
          npm run test:content
          npm run test:ui:history-language-audit
          npm run test:ui:english-t3-bilingual

      - name: Validar entrega editorial do lote alterado
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/content-delivery.cjs --base-ref "origin/${BASE_REF}" --head-ref origin/pr-head > "$RUNNER_TEMP/content-delivery.json"
          cat "$RUNNER_TEMP/content-delivery.json"
          npm run test:delivery
          CONTENT_DELIVERY_ARTIFACTS="$RUNNER_TEMP/content-delivery/pilot" npm run test:ui:content-delivery-pilot
          CONTENT_DELIVERY_RESULT="$RUNNER_TEMP/content-delivery.json" CONTENT_DELIVERY_ARTIFACTS="$RUNNER_TEMP/content-delivery/publication" npm run test:ui:content-delivery

      - name: Preservar evidencias do piloto e do lote publicado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: content-delivery-evidence
          path: |
            ${{ runner.temp }}/content-delivery.json
            ${{ runner.temp }}/content-delivery/
          if-no-files-found: ignore
