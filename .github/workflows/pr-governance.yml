name: PR Governance

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate branch policy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/develop:refs/remotes/origin/develop" \
            "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          npm run validate:branch -- "$HEAD_REF" "$BASE_REF"
          npm run validate:branch-sync -- "$HEAD_REF" "$BASE_REF"
          npm run test:branch-policy

      - name: Validate repository documentation presence
        run: |
          test -f docs/README.md
          test -f docs/github/branching-and-delivery-strategy.md

      - name: Validate lint and formatting
        run: |
          npm run lint
          npm run format:check
