name: PR Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-governance:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate branch policy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          npm run validate:branch -- "$HEAD_REF" "$BASE_REF"
          npm run validate:branch-sync -- "$HEAD_REF" "$BASE_REF" origin/pr-head
          npm run test:branch-policy

      - name: Validate merge message in Portuguese
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/merge-message-policy.cjs validate-pr

      - name: Validate repository documentation presence
        run: |
          test -f docs/README.md
          test -f docs/github/branching-and-delivery-strategy.md

      - name: Verificar escopo e qualidade da entrega
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_DELIVERY_ARTIFACTS: ${{ runner.temp }}/content-delivery/publication
        run: npm run verify:local -- --base-ref "origin/${{ github.base_ref }}" --head-ref origin/pr-head

      - name: Preservar evidencias do piloto e do lote publicado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: content-delivery-evidence
          path: |
            ${{ runner.temp }}/content-delivery.json
            ${{ runner.temp }}/content-delivery/
          if-no-files-found: ignore
